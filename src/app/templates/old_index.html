<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>踩地雷</title>
    <style>
      body { font-family: sans-serif; }
    </style>
  </head>
  <body>
    <h1>踩地雷（Demo）</h1>
    <div id="controls">
      <button onclick="start()">開始（預設 15x15）</button>
      <button onclick="state()">取得狀態</button>
    </div>
    <pre id="output"></pre>

    <script>
    async function start(){
      const res = await fetch('/start', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({rows:15,cols:15,bomb_ratio:0.1})});
      document.getElementById('output').textContent = await res.text();
    }
    async function state(){
      const res = await fetch('/state');
      document.getElementById('output').textContent = await res.text();
    }
    </script>
  </body>
</html>
